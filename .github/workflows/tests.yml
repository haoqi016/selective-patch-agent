name: Synthetic mechanism tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python selective_patch.py examples/old_knowledge.json examples/new_catalog.json --output /tmp/selective-patch-demo.json
      - run: diff examples/expected_patch.json /tmp/selective-patch-demo.json
